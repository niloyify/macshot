name: ShotKit release

# Builds ShotKit (shotkit/ folder) for Windows, macOS and Linux and attaches
# the files to a GitHub release. Push a tag like shotkit-v1.0.0 to run it.
on:
  push:
    tags: ["shotkit-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: shotkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Sign (ad-hoc) and zip the Mac app
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d dist/mac-universal/ShotKit.app)
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" dist/ShotKit-mac.zip

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ShotKit ${{ github.ref_name }}
          body: |
            ShotKit: screenshots and screen recording for Windows, macOS and Linux.
            Alt+Shift+1 takes a screenshot, Alt+Shift+5 starts or stops recording.

            - Windows: ShotKit-Setup-*.exe (installer) or ShotKit-Portable-*.exe (no install)
            - macOS: ShotKit-mac.zip (unzip, move ShotKit to Applications)
            - Linux: ShotKit-*.AppImage (make it executable and run) or the .deb package
          files: |
            shotkit/dist/*.exe
            shotkit/dist/*.AppImage
            shotkit/dist/*.deb
            shotkit/dist/ShotKit-mac.zip
