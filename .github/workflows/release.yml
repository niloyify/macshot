name: Release

# Builds Shot.app on a Mac and publishes it as a downloadable release.
# Run it from the Actions tab (Run workflow) or by pushing a tag like v1.1.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, for example v1.0"
        required: true
        default: "v1.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Shot.app
        run: bash build.sh

      - name: Check the app
        run: |
          lipo -archs Shot.app/Contents/MacOS/Shot
          codesign --verify --verbose=2 Shot.app

      - name: Zip the app
        run: ditto -c -k --keepParent Shot.app Shot.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" Shot.zip \
            --target "$GITHUB_SHA" \
            --title "Shot ${TAG#v}" \
            --notes "Download Shot.zip, unzip it and move Shot.app to Applications. See the README for the first-open steps."
