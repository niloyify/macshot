name: TouchKit release

# Builds TouchKit (touchkit/ folder) for Windows, macOS and Linux and attaches
# the files to a GitHub release. Push a tag like touchkit-v1.0.0 to run it.
on:
  push:
    tags: ["touchkit-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: touchkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Build the Mac input helper (universal)
        if: runner.os == 'macOS'
        run: |
          swiftc -O -target arm64-apple-macos12 native/mac/input.swift -o /tmp/input-arm64
          swiftc -O -target x86_64-apple-macos12 native/mac/input.swift -o /tmp/input-x86_64
          lipo -create /tmp/input-arm64 /tmp/input-x86_64 -output native/mac/input

      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Sign (ad-hoc) and zip the Mac app
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d dist/mac-universal/TouchKit.app)
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" dist/TouchKit-mac.zip

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: TouchKit ${{ github.ref_name }}
          body: |
            TouchKit: an all-in-one helper for Windows, macOS and Linux.
            Phone remote (touchpad, Touch Bar, keyboard), on-screen Touch Bar, window snap,
            screenshots, screen recording, camera, clipboard history, notes, to-do, focus timer,
            world clock, time tracker, invoice maker, rate calculator, text / JSON / QR / password
            tools, unit converter and image resizer.

            - Windows: TouchKit-Setup-*.exe (installer) or TouchKit-Portable-*.exe (no install)
            - macOS: TouchKit-mac.zip (unzip, move TouchKit to Applications)
            - Linux: TouchKit-*.AppImage or the .deb package (install xdotool for the phone remote)
          files: |
            touchkit/dist/*.exe
            touchkit/dist/*.AppImage
            touchkit/dist/*.deb
            touchkit/dist/TouchKit-mac.zip
