name: Jhuli release (was TouchKit)

# Builds Jhuli (touchkit/ folder; it used to be TouchKit) for Windows, macOS and
# Linux and attaches the files to a GitHub release. Push a tag like jhuli-v3.1.0.
on:
  push:
    tags: ["touchkit-v*", "jhuli-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: touchkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Build the Mac input helper (universal)
        if: runner.os == 'macOS'
        run: |
          swiftc -O -target arm64-apple-macos12 native/mac/input.swift -o /tmp/input-arm64
          swiftc -O -target x86_64-apple-macos12 native/mac/input.swift -o /tmp/input-x86_64
          lipo -create /tmp/input-arm64 /tmp/input-x86_64 -output native/mac/input

      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Sign (ad-hoc) and zip the Mac app
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d dist/mac-universal/Jhuli.app)
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" dist/Jhuli-mac.zip

      # Stable file names, so https://github.com/niloyify/macshot/releases/latest/download/<name> always works.
      - name: Copies with stable names
        shell: bash
        run: |
          cd dist
          for f in Jhuli-Setup-*.exe; do [ -e "$f" ] && cp "$f" Jhuli-Setup.exe; done
          for f in Jhuli-Portable-*.exe; do [ -e "$f" ] && cp "$f" Jhuli-Portable.exe; done
          for f in Jhuli-*.AppImage; do [ -e "$f" ] && cp "$f" Jhuli.AppImage; done
          for f in jhuli_*_amd64.deb; do [ -e "$f" ] && cp "$f" jhuli_amd64.deb; done
          true

      # The Android APK is built and signed on the Mac (android/build.sh) and kept in
      # android/release/; the Linux job attaches it.
      - name: Android APK
        if: runner.os == 'Linux'
        run: |
          cp android/release/Jhuli.apk dist/Jhuli.apk
          cp android/release/Jhuli.apk "dist/Jhuli-$(node -p "require('./package.json').version").apk"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Jhuli ${{ github.ref_name }}
          body: |
            Jhuli (ঝুলি): TouchKit and MacShot in one app, for Windows, macOS, Linux, Android, iPhone and the web.
            127 everyday tools plus screenshots (area / full screen), copy text from the screen (OCR, Bangla + English),
            annotate, colour picker, screen recording, sound recording, camera photo and video, clipboard history,
            notes, timer, QR codes, PDF tools, phone remote and an on-screen Touch Bar.

            - Windows: Jhuli-Setup-*.exe (installer) or Jhuli-Portable-*.exe (no install)
            - macOS: Jhuli-mac.zip (unzip, move Jhuli to Applications, right-click → Open the first time)
            - Linux: Jhuli-*.AppImage or the .deb package (install xdotool for the phone remote)
            - Android: Jhuli.apk (allow installing from this source when Android asks)
            - iPhone, iPad, tablets, Chromebooks and any browser: https://niloyify.github.io/macshot/ (Safari → Share → Add to Home Screen)

            Download page: https://niloyify.github.io/macshot/get/
          files: |
            touchkit/dist/*.exe
            touchkit/dist/*.AppImage
            touchkit/dist/*.deb
            touchkit/dist/*.apk
            touchkit/dist/Jhuli-mac.zip
