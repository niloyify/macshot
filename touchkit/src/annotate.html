<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>TouchKit Annotate</title>
<link rel="stylesheet" href="tools.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #bar .group { display: flex; gap: 4px; align-items: center; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); }
  #bar .group:last-child { border-right: 0; }
  .tool.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer; }
  .dot.on { border-color: var(--text); }
  #stage { flex: 1; overflow: auto; display: grid; place-items: center; background: var(--bg); padding: 16px; }
  #canvas { max-width: 100%; max-height: 100%; box-shadow: 0 4px 20px rgba(0,0,0,.35); background: #fff; cursor: crosshair; }
  #textInput { position: fixed; display: none; background: transparent; border: 1px dashed var(--accent); outline: none; font: 600 20px system-ui, sans-serif; padding: 0 2px; min-width: 60px; }
  .spacer { flex: 1; }
</style>
<div id="bar">
  <div class="group" id="tools">
    <button class="tool on" data-tool="arrow" title="Arrow (A)">↗ Arrow</button>
    <button class="tool" data-tool="box" title="Box (R)">▭ Box</button>
    <button class="tool" data-tool="pen" title="Pen (P)">✎ Pen</button>
    <button class="tool" data-tool="mark" title="Highlighter (H)">▮ Highlight</button>
    <button class="tool" data-tool="text" title="Text (T)">T Text</button>
    <button class="tool" data-tool="step" title="Numbered step (N)">① Step</button>
    <button class="tool" data-tool="blur" title="Hide a part (B)">▦ Blur</button>
  </div>
  <div class="group" id="colors"></div>
  <div class="group">
    <select id="width" title="Line size"><option value="3">Thin</option><option value="6" selected>Medium</option><option value="12">Thick</option></select>
  </div>
  <div class="group">
    <button id="undo" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
    <button id="redo" title="Redo (Ctrl/Cmd+Shift+Z)">↷ Redo</button>
  </div>
  <span class="spacer"></span>
  <div class="group">
    <button id="copy" title="Copy to the clipboard (Ctrl/Cmd+C)">Copy</button>
    <button id="save" class="primary" title="Save to Pictures/TouchKit (Ctrl/Cmd+S)">Save</button>
  </div>
</div>
<div id="stage"><canvas id="canvas"></canvas></div>
<input id="textInput" spellcheck="false">
<script src="annotate.js"></script>
