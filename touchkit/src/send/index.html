<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d7bff">
<title>Jhuli Send</title>
<style>
  :root { --bg: #f5f7fb; --card: #fff; --text: #111827; --muted: #6b7280; --line: #e5e7eb; --accent: #3d7bff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #131c2e; --text: #e5e7eb; --muted: #94a3b8; --line: #23304a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Bengali", sans-serif; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 24px; margin: 8px 0 0; } .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .drop { display: grid; place-items: center; text-align: center; gap: 6px; border: 2px dashed var(--line); border-radius: 14px; padding: 26px 12px; cursor: pointer; }
  .drop.over { border-color: var(--accent); }
  .btn { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; } .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  progress { width: 100%; height: 8px; } input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>👀 Jhuli Send</h1>
  <p class="muted" id="to">Connecting…</p>
  <div class="card" id="pinBox" hidden><label class="muted">Code shown on the computer</label><input type="text" id="pin" inputmode="numeric" maxlength="6"><p><button class="btn" id="pinGo">Connect</button></p></div>
  <div class="card">
    <b>Send to the computer · কম্পিউটারে পাঠান</b>
    <label class="drop" id="drop"><span style="font-size:34px">📤</span><span>Tap to choose photos, videos or files<br><span class="muted">ছবি, ভিডিও বা ফাইল বেছে নিন</span></span><input type="file" id="files" multiple hidden></label>
    <div id="up"></div>
  </div>
  <div class="card"><b>Get from the computer · কম্পিউটার থেকে নিন</b><div id="list"><p class="muted">Nothing shared yet. On the computer, press “Share files”.</p></div></div>
</main>
<script>
  let pin = location.hash.slice(1);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const size = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  async function load() {
    const r = await fetch('/api/info?pin=' + pin).catch(() => null);
    if (!r || r.status === 401) { $('#pinBox').hidden = false; $('#to').textContent = 'Enter the code shown in Jhuli on the computer.'; return; }
    const d = await r.json();
    $('#pinBox').hidden = true; $('#to').textContent = 'Connected to ' + d.name;
    $('#list').innerHTML = d.files.length ? d.files.map((f) => `<div class="row"><span class="grow">${esc(f.name)}</span><span class="muted">${size(f.size)}</span><a class="btn" href="/api/file?pin=${pin}&id=${f.id}" download="${esc(f.name)}">Get</a></div>`).join('') : '<p class="muted">Nothing shared yet. On the computer, press “Share files”.</p>';
  }
  function send(file) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<span class="grow">${esc(file.name)}</span><progress max="1" value="0"></progress>`;
    $('#up').prepend(row);
    const x = new XMLHttpRequest();
    x.open('POST', `/api/upload?pin=${pin}&name=${encodeURIComponent(file.name)}`);
    x.upload.onprogress = (e) => { if (e.lengthComputable) row.querySelector('progress').value = e.loaded / e.total; };
    x.onload = () => { row.lastElementChild.outerHTML = x.status === 200 ? '<span>✅ Sent</span>' : '<span>❌ Failed</span>'; };
    x.onerror = () => { row.lastElementChild.outerHTML = '<span>❌ Failed</span>'; };
    x.send(file);
  }
  $('#files').onchange = (e) => { [...e.target.files].forEach(send); e.target.value = ''; };
  const drop = $('#drop');
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); [...e.dataTransfer.files].forEach(send); };
  $('#pinGo').onclick = () => { pin = $('#pin').value.trim(); location.hash = pin; load(); };
  load(); setInterval(load, 4000);
</script>
</body>
</html>
